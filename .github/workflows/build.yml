name: Build Jarvis APK
on:
  workflow_dispatch:
  push:
jobs:
 b:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-java@v4
    with:
     distribution: temurin
     java-version: 17
  - uses: gradle/actions/setup-gradle@v4
    with:
     gradle-version: 8.7
  - run: |
     cat > settings.gradle.kts <<'JEOF'
     pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
     dependencyResolutionManagement { repositories { google(); mavenCentral() } }
     rootProject.name = "Jarvis"
     include(":app")
     JEOF
     cat > build.gradle.kts <<'JEOF'
     plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
     }
     JEOF
     cat > gradle.properties <<'JEOF'
     org.gradle.jvmargs=-Xmx3g
     android.nonTransitiveRClass=true
     JEOF
     mkdir -p app
     cat > app/build.gradle.kts <<'JEOF'
     plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
     }
     android {
      namespace = "com.vaibhav.jarvis"
      compileSdk = 34
      defaultConfig {
       applicationId = "com.vaibhav.jarvis"
       minSdk = 26
       targetSdk = 34
       versionCode = 1
       versionName = "1.0"
      }
      compileOptions {
       sourceCompatibility = JavaVersion.VERSION_17
       targetCompatibility = JavaVersion.VERSION_17
      }
      kotlinOptions { jvmTarget = "17" }
     }
     dependencies {
      implementation("ai.picovoice:porcupine-android:3.0.3")
     }
     JEOF
     mkdir -p app/src/main
     cat > app/src/main/AndroidManifest.xml <<'JEOF'
     <?xml version="1.0" encoding="utf-8"?>
     <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <uses-permission android:name="android.permission.RECORD_AUDIO" />
      <uses-permission android:name="android.permission.CALL_PHONE" />
      <uses-permission android:name="android.permission.SEND_SMS" />
      <uses-permission android:name="android.permission.READ_CONTACTS" />
      <uses-permission android:name="android.permission.SET_ALARM" />
      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
      <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
      <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
      <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
      <uses-permission android:name="android.permission.INTERNET" />
      <uses-permission android:name="android.permission.WAKE_LOCK" />
      <application android:label="Jarvis" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
       <activity android:name=".MainActivity" android:exported="true">
        <intent-filter>
         <action android:name="android.intent.action.MAIN" />
         <category android:name="android.intent.category.LAUNCHER" />
        </intent-filter>
       </activity>
       <service android:name=".JarvisService" android:exported="false"
        android:foregroundServiceType="microphone" />
      </application>
     </manifest>
     JEOF
     mkdir -p app/src/main/java/com/vaibhav/jarvis
     cp *.kt app/src/main/java/com/vaibhav/jarvis/
  - run: gradle assembleDebug --no-daemon
  - uses: actions/upload-artifact@v4
    with:
     name: jarvis-apk
     path: app/build/outputs/apk/debug/app-debug.apk
     
