name: Build Jarvis APK
on:
  workflow_dispatch:
  push:
jobs:
 b:
  runs-on: ubuntu-latest
  permissions:
   contents: write
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-java@v4
    with:
     distribution: temurin
     java-version: 17
  - uses: gradle/actions/setup-gradle@v4
    with:
     gradle-version: 8.7
  - run: |
     cat > settings.gradle.kts <<'JEOF'
     pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
     dependencyResolutionManagement { repositories { google(); mavenCentral() } }
     rootProject.name = "Jarvis"
     include(":app")
     JEOF
     cat > build.gradle.kts <<'JEOF'
     plugins {
      id("com.android.application") version "8.5.2" apply false
      id("org.jetbrains.kotlin.android") version "1.9.24" apply false
     }
     JEOF
     cat > gradle.properties <<'JEOF'
     org.gradle.jvmargs=-Xmx3g
     android.nonTransitiveRClass=true
     android.useAndroidX=true
     JEOF
     mkdir -p app
     cat > app/build.gradle.kts <<'JEOF'
     plugins {
      id("com.android.application")
      id("org.jetbrains.kotlin.android")
     }
     android {
      namespace = "com.vaibhav.jarvis"
      compileSdk = 34
      defaultConfig {
       applicationId = "com.vaibhav.jarvis"
       minSdk = 26
       targetSdk = 34
       versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
       versionName = "1.0"
      }
      compileOptions {
       sourceCompatibility = JavaVersion.VERSION_17
       targetCompatibility = JavaVersion.VERSION_17
      }
      kotlinOptions { jvmTarget = "17" }
      signingConfigs {
       create("jv") {
        storeFile = file("../jarvis.keystore")
        storePassword = "jarvis123"
        keyAlias = "jarvis"
        keyPassword = "jarvis123"
       }
      }
      buildTypes {
       getByName("debug") { signingConfig = signingConfigs.getByName("jv") }
      }
     }
     dependencies {
      implementation("com.alphacephei:vosk-android:0.3.47")
     }
     JEOF
     mkdir -p app/src/main
     cat > app/src/main/AndroidManifest.xml <<'JEOF'
     <?xml version="1.0" encoding="utf-8"?>
     <manifest xmlns:android="http://schemas.android.com/apk/res/android">
      <uses-permission android:name="android.permission.RECORD_AUDIO" />
      <uses-permission android:name="android.permission.CALL_PHONE" />
      <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
      <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
      <uses-permission android:name="android.permission.READ_CALENDAR" />
      <uses-permission android:name="android.permission.SEND_SMS" />
      <uses-permission android:name="android.permission.READ_CONTACTS" />
      <uses-permission android:name="android.permission.SET_ALARM" />
      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
      <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
      <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
      <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
      <uses-permission android:name="android.permission.INTERNET" />
      <uses-permission android:name="android.permission.WAKE_LOCK" />
      <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
      <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
      <application android:label="Jarvis" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
       <activity android:name=".MainActivity" android:exported="true">
        <intent-filter>
         <action android:name="android.intent.action.MAIN" />
         <category android:name="android.intent.category.LAUNCHER" />
        </intent-filter>
       </activity>
       <service android:name=".JarvisService" android:exported="false"
        android:foregroundServiceType="microphone" />
       <service android:name=".MsgListener" android:exported="true" android:label="Jarvis"
        android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
        <intent-filter>
         <action android:name="android.service.notification.NotificationListenerService" />
        </intent-filter>
       </service>
       <service android:name=".SendAcc" android:exported="true" android:label="Jarvis auto send"
        android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
        <intent-filter>
         <action android:name="android.accessibilityservice.AccessibilityService" />
        </intent-filter>
        <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc" />
       </service>
      </application>
     </manifest>
     JEOF
     mkdir -p app/src/main/res/xml
     cat > app/src/main/res/xml/acc.xml <<'JEOF'
     <?xml version="1.0" encoding="utf-8"?>
     <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
      android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged"
      android:accessibilityFeedbackType="feedbackGeneric"
      android:accessibilityFlags="flagReportViewIds"
      android:canRetrieveWindowContent="true"
      android:packageNames="com.whatsapp,com.whatsapp.w4b,com.instagram.android,com.android.settings,com.google.android.youtube"
      android:description="@string/acc_desc"
      android:notificationTimeout="200" />
     JEOF
     mkdir -p app/src/main/res/values
     cat > app/src/main/res/values/strings.xml <<'JEOF'
     <?xml version="1.0" encoding="utf-8"?>
     <resources>
      <string name="acc_desc">Jarvis WhatsApp message apne aap bhejne ke liye</string>
     </resources>
     JEOF
     mkdir -p app/src/main/res/mipmap-xxxhdpi
